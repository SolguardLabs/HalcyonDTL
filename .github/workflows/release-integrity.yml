name: Release integrity

on:
  push:
    branches: [main, production]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.22.12
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: node scripts/verify-published-ref.mjs
        env:
          VERIFY_EVENT: ${{ github.event_name }}
          VERIFY_REF_TYPE: ${{ github.ref_type }}
          VERIFY_REF_NAME: ${{ github.ref_name }}
